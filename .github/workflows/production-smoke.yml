name: کنترل Production
on:
  workflow_dispatch:
    inputs:
      production_url:
        description: نشانی Production بدون اسلش پایانی
        required: true
        default: https://hasab-yar-production.up.railway.app
      expected_sha:
        description: SHA مورد انتظار main
        required: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: دریافت کد
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: آماده‌سازی Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: تطبیق SHA، health و JavaScript فعال
        env:
          PRODUCTION_URL: ${{ inputs.production_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_MARKERS: بسته بیشتر از ۴۰۱ ردیف,سقف امن
        run: npm run smoke:production
